name: One-off domain health check

# Temporary diagnostic: public DNS records only. Removed after one run.
on:
  push:
    branches: [claude/amazing-bohr-ntvs0u]
    paths: [.github/workflows/domain-check.yml]

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: DKIM selectors and www certificate
        run: |
          for s in zmail zoho zm1 zm2 selector1 selector2 mail dkim; do
            r=$(dig +short TXT "$s._domainkey.actaseal.com"); [ -n "$r" ] && echo "DKIM $s: present (${#r} chars)" || echo "DKIM $s: none"
          done
          echo | openssl s_client -connect www.actaseal.com:443 -servername www.actaseal.com 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName -dates || true
          echo | openssl s_client -connect actaseal.com:443 -servername actaseal.com 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName -dates || true
          curl -sS -m 20 -o /dev/null -w 'http://www -> %{http_code} %{redirect_url}\n' http://www.actaseal.com/ || true
