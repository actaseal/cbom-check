name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt pytest
      - run: pytest -v
      - name: Clean CBOM exits 0
        run: python cbom_check.py fixtures/clean.json --acvp fixtures/acvp_clean.json --baseline fixtures/baseline.json --strict

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: web/.cache
          key: pyodide-${{ hashFiles('web/build.py') }}
      - run: python web/build.py

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean CBOM passes through the action
        uses: ./
        with:
          cbom: fixtures/certin_complete.json
          acvp: fixtures/acvp_clean.json
          baseline: fixtures/baseline.json
          profile: cert-in
          strict: "true"
      - name: Broken CBOM fails the action
        id: broken
        continue-on-error: true
        uses: ./
        with:
          cbom: fixtures/nist_level_mismatch.json
      - name: Expect the broken CBOM to have failed
        if: steps.broken.outcome != 'failure'
        run: exit 1
