name: CBOM Check
description: Semantic checks for CycloneDX CBOMs. Fails the job when the CBOM is wrong, not just malformed.
branding:
  icon: shield
  color: blue

inputs:
  cbom:
    description: Path to the CycloneDX CBOM (JSON)
    required: true
  acvp:
    description: Path to an ACVP / CAVP test report to cross-check (optional)
    required: false
    default: ""
  baseline:
    description: Path to the previous CBOM, to check serialNumber/timestamp refresh (optional)
    required: false
    default: ""
  profile:
    description: 'Extra requirement profiles, comma-separated: cert-in, weak, cnsa2 (optional)'
    required: false
    default: ""
  strict:
    description: Treat warnings as errors
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: python -m pip install --quiet -r "$GITHUB_ACTION_PATH/requirements.txt"
    - shell: bash
      env:
        CBOM: ${{ inputs.cbom }}
        ACVP: ${{ inputs.acvp }}
        BASELINE: ${{ inputs.baseline }}
        PROFILE: ${{ inputs.profile }}
        STRICT: ${{ inputs.strict }}
      run: |
        args=("$CBOM" --inventory)
        [ -n "$ACVP" ] && args+=(--acvp "$ACVP")
        [ -n "$BASELINE" ] && args+=(--baseline "$BASELINE")
        IFS=',' read -ra profiles <<< "$PROFILE"
        for p in "${profiles[@]}"; do
          p="${p//[[:space:]]/}"
          [ -n "$p" ] && args+=(--profile "$p")
        done
        [ "$STRICT" = "true" ] && args+=(--strict)
        python "$GITHUB_ACTION_PATH/cbom_check.py" "${args[@]}"
